# Auto-deploy to Hostinger on every push to main (or manually from the Actions tab).
#
# SITE_MODE (repository variable, Settings → Secrets and variables → Actions → Variables):
#   coming-soon (default) — public domain   ← site/out-coming-soon/  (every path shows the Coming Soon page)
#                           preview domain  ← site/out/ + password + noindex (team only)
#   live                  — public domain   ← site/out/  (the full website; set this on launch day)
#
# Required secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, PREVIEW_PASSWORD
# Optional secrets:   PREVIEW_USER (default "team")
# Variables:          SITE_MODE, FTP_SITE_DIR (default "./"), FTP_PREVIEW_DIR (e.g. "preview/"),
#                     PREVIEW_HTPASSWD_PATH (absolute server path of the preview's .htpasswd),
#                     FTP_PROTOCOL (default "ftps"), FTP_SECURITY (default "strict"; "loose" if Hostinger's TLS
#                     certificate does not match the FTP host name)
# Full setup: site/README.md → "Auto-deploy (GitHub Actions)".

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false # never interrupt an upload half-way

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_MODE: ${{ vars.SITE_MODE || 'coming-soon' }}
      FTP_SITE_DIR: ${{ vars.FTP_SITE_DIR || './' }}
      FTP_PREVIEW_DIR: ${{ vars.FTP_PREVIEW_DIR }}
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check configuration
        id: config
        env:
          HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
        run: |
          case "$SITE_MODE" in coming-soon|live) ;; *) echo "::error::SITE_MODE must be 'coming-soon' or 'live' (got '$SITE_MODE')"; exit 1;; esac
          for d in "$FTP_SITE_DIR" ${FTP_PREVIEW_DIR:+"$FTP_PREVIEW_DIR"}; do
            case "$d" in */) ;; *) echo "::error::FTP directories must end with '/' (got '$d')"; exit 1;; esac
          done
          # The preview must be a sub-folder of the public site, never the public folder itself
          if [ -n "$FTP_PREVIEW_DIR" ]; then
            site_n="${FTP_SITE_DIR#./}"; prev_n="${FTP_PREVIEW_DIR#./}"
            if [ "$prev_n" = "$site_n" ] || [ -z "${prev_n#"$site_n"}" ]; then
              echo "::error::FTP_PREVIEW_DIR ('$FTP_PREVIEW_DIR') is the public site folder. Use the preview sub-folder, e.g. 'preview/' (or 'public_html/preview/' if FTP_SITE_DIR is 'public_html/')."
              exit 1
            fi
            case "$prev_n" in public_html/) echo "::error::FTP_PREVIEW_DIR must not be 'public_html/' — use 'public_html/preview/' and set FTP_SITE_DIR to 'public_html/'."; exit 1;; esac
          fi
          if [ "$HAS_FTP" != "true" ]; then
            echo "::warning::FTP secrets are not set — the site is built and checked, but nothing is deployed. See site/README.md."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
          # Glob that keeps the public deploy away from the preview folder when it lives inside public_html
          if [ -n "$FTP_PREVIEW_DIR" ]; then
            rel="${FTP_PREVIEW_DIR#./}"; rel="${rel#"${FTP_SITE_DIR#./}"}"
            echo "preview_glob=${rel%/}/**" >> "$GITHUB_OUTPUT"
          else
            echo "preview_glob=.ftp-preview-none/**" >> "$GITHUB_OUTPUT"
          fi
          echo "Mode: $SITE_MODE · public dir: $FTP_SITE_DIR · preview dir: ${FTP_PREVIEW_DIR:-(none)}"

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build the website (out/)
        run: npm run build

      - name: Build the Coming Soon page (out-coming-soon/)
        if: env.SITE_MODE == 'coming-soon'
        run: npm run build:coming-soon

      - name: Lock the team preview (password + noindex)
        if: env.SITE_MODE == 'coming-soon' && env.FTP_PREVIEW_DIR != ''
        env:
          PREVIEW_USER: ${{ secrets.PREVIEW_USER }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          PREVIEW_HTPASSWD_PATH: ${{ vars.PREVIEW_HTPASSWD_PATH }}
        run: node scripts/protect-preview.mjs out

      # Shows which folder the FTP login opens in, so a wrong account or FTP_SITE_DIR is visible in the log.
      - name: Check where the FTP login lands
        if: steps.config.outputs.deploy == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
        run: |
          opts=(--silent --show-error --list-only --max-time 60 --user "$FTP_USERNAME:$FTP_PASSWORD")
          [ "$FTP_PROTOCOL" != "ftp" ] && opts+=(--ssl-reqd)
          [ "$FTP_SECURITY" = "loose" ] && opts+=(--insecure)
          site="${FTP_SITE_DIR#./}"
          echo "Login folder contains:"; root=$(curl "${opts[@]}" "ftp://$FTP_SERVER/") || { echo "::error::Could not log in to list the FTP folder (check FTP_SERVER / FTP_USERNAME / FTP_PASSWORD)."; exit 1; }
          echo "$root" | sed 's/^/  /'
          if [ -n "$site" ]; then echo "FTP_SITE_DIR ($FTP_SITE_DIR) contains:"; curl "${opts[@]}" "ftp://$FTP_SERVER/$site" | sed 's/^/  /' || true; fi
          echo "The upload goes into: login folder + '${FTP_SITE_DIR}'. The domain's public_html should be that folder."

      # ── Coming Soon mode ────────────────────────────────────────────────────────────────────────
      - name: Deploy Coming Soon → public domain
        if: env.SITE_MODE == 'coming-soon' && steps.config.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./site/out-coming-soon/
          server-dir: ${{ env.FTP_SITE_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            ${{ steps.config.outputs.preview_glob }}

      - name: Deploy website → team preview
        if: env.SITE_MODE == 'coming-soon' && env.FTP_PREVIEW_DIR != '' && steps.config.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./site/out/
          server-dir: ${{ env.FTP_PREVIEW_DIR }}
          state-name: .ftp-deploy-sync-state.json

      # ── Live mode (launch) ──────────────────────────────────────────────────────────────────────
      - name: Deploy website → public domain
        if: env.SITE_MODE == 'live' && steps.config.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./site/out/
          server-dir: ${{ env.FTP_SITE_DIR }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            ${{ steps.config.outputs.preview_glob }}

      # Proves the upload reached the folder the domain actually serves: the live robots.txt must be this build's
      # (the website's has a Sitemap line; the Coming Soon page's does not).
      - name: Verify the live domain shows the website
        if: env.SITE_MODE == 'live' && steps.config.outputs.deploy == 'true'
        run: |
          url=$(node -p "require('./src/content/site.json').url.replace(/\/$/, '')")
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$url/robots.txt?v=$GITHUB_RUN_ID-$i" || true)
            if echo "$body" | grep -q '^Sitemap:'; then echo "✓ $url is serving the website."; exit 0; fi
            sleep 10
          done
          echo "Live robots.txt returned:"; echo "$body" | sed 's/^/  /'
          echo "::error::Uploaded, but $url is not serving this build (it still looks like the Coming Soon page). The files went to a different folder than the domain's public_html — check that FTP_USERNAME is the FTP account whose directory is .../public_html and that FTP_SITE_DIR is './'."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy — mode: \`$SITE_MODE\`"
            if [ "${{ steps.config.outputs.deploy }}" != "true" ]; then echo "Built only — FTP secrets not configured.";
            elif [ "$SITE_MODE" = "live" ]; then echo "Public domain: full website.";
            else echo "Public domain: Coming Soon. Team preview: ${FTP_PREVIEW_DIR:-not configured}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
