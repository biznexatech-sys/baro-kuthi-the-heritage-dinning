<!-- @dsCard group="Colors" viewport="700x190" name="Ratio & rhythm" subtitle="70 / 25 / 5 — alternate light and dark, never two dark in a row" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ratio & rhythm</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"><style>.bar{display:flex;height:40px;border:1px solid var(--copper)}.bar div{display:flex;align-items:center;padding:0 12px;font:600 12px/1 var(--font-serif);font-variant:all-small-caps;letter-spacing:.18em}.strip{display:flex;height:40px;margin-top:10px;gap:0}.strip div{flex:1;border:1px solid var(--copper);margin-left:-1px;display:flex;align-items:center;justify-content:center;font:600 11px/1 var(--font-serif);font-variant:all-small-caps;letter-spacing:.14em}</style></head><body><p class="lbl" style="margin-bottom:8px">Colour ratio</p><div class="bar"><div style="flex:70;background:var(--parchment);color:var(--terracotta)">Parchment 70%</div><div style="flex:25;background:var(--terracotta);color:var(--white)">Terracotta 25%</div><div style="flex:5;background:var(--copper)"></div></div><p class="lbl" style="margin:16px 0 0">Home page rhythm</p><div class="strip"><div style="background:var(--ink);color:var(--copper)">Hero</div><div style="background:var(--parchment);color:var(--terracotta)">I–II</div><div style="background:var(--terracotta-deep);color:var(--copper)">III</div><div style="background:var(--parchment);color:var(--terracotta)">IV</div><div style="background:var(--terracotta);color:var(--parchment)">V</div><div style="background:var(--parchment);color:var(--terracotta)">VI–VII</div><div style="background:var(--terracotta-deep);color:var(--copper)">Footer</div></div></body></html>
